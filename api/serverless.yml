service: lynxbox-api

provider:
  name: aws
  runtime: nodejs18.x
  stage: dev
  region: ap-southeast-1
  environment:
    DYNAMODB_TABLE: ${env:DYNAMODB_TABLE}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME}
    USER_POOL_ID: ${env:USER_POOL_ID}
    FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:3001'}
    AWS_REGION: ap-southeast-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
            - s3:GetObject
          Resource: "arn:aws:s3:::${env:S3_BUCKET_NAME}/*"
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource: "arn:aws:s3:::${env:S3_BUCKET_NAME}"
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminGetUser
            - cognito-idp:DescribeUserPool
          Resource: "arn:aws:cognito-idp:ap-southeast-1:*:userpool/${env:USER_POOL_ID}"
  httpApi:
    authorizers:
      ApiGatewayAuthorizer:
        type: jwt
        identitySource:
          - $request.header.Authorization
        jwtConfiguration:
          audience:
            - ${env:COGNITO_USER_POOL_CLIENT_ID}
          issuer:
            - ${env:COGNITO_USER_POOL_ISSUER}

